plugins:
  - search
  - meta
  - autorefs
  - macros:
      module_name: main
      on_error_fail: false
      include_yaml:
        - block_interactions: data/block_interactions.yml
        - comparators: data/comparators.yml
        - dimension_ambient_lights: data/dimension_ambient_lights.yml
        - equipment_slots: data/equipment_slots.yml
        - light_types: data/light_types.yml
        - precipitations: data/precipitations.yml
        - shapes: data/shapes.yml
      j2_extensions:
        - jinja2.ext.do

markdown_extensions:
  - toc:
      separator: "_"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - footnotes

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

