site_name: Kaya Documentation
site_url: https://eggodocs.github.io/kaya/

repo_url: https://github.com/eggomods/kaya
repo_name: eggomods/kaya

theme:
  name: material
  custom_dir: overrides
  favicon: img/icon.png
  logo: img/icon.png
  font:
    text: Roboto Slab
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: deep purple
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: deep purple
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.footnote.tooltips
    - content.tabs.link
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.share

