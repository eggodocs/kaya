site_name: neo-apoli Documentation
site_url: https://eggodocs.github.io/neo-apoli/

repo_url: https://github.com/eggohito/neo-apoli
repo_name: eggohito/neo-apoli

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.tabs.link
    - navigation.expand
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - search.share

plugins:
  - search
  - meta
  - autorefs
  - macros:
      module_name: main
      on_error_fail: false

markdown_extensions:
  - toc:
      separator: "_"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra:
  version:
    provider: mike
  mc:
    identifier: https://minecraft.wiki/w/Identifier
    text_component: https://minecraft.wiki/w/Text_component_format
    biome_identifier: https://minecraft.wiki/w/Biome#Biome_IDs
    structure_identifier: https://minecraft.wiki/w/Structure#ID
    biome_tag: https://minecraft.wiki/w/Biome_tag_(Java_Edition)
    structure_tag: https://minecraft.wiki/w/Structure_tag_(Java_Edition)
    data_component: https://minecraft.wiki/w/Data_component_format
    nbt: https://minecraft.wiki/w/NBT_format
    nbt_path: https://minecraft.wiki/w/NBT_path
